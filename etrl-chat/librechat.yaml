version: 1.3.4

cache: true
fileStrategy: "s3"

# ==============================================================================
# 1. ИНТЕРФЕЙС
# ==============================================================================
interface:
  appTitle: 'ETRL Chat'
  customWelcome: 'Добро пожаловать в ETRL Chat!'
  customCSS: true # <--- ПЕРЕНЕСЕНО СЮДА (из корня)
  
  runCode: false
  endpointsMenu: false 
  modelSelect: false
  parameters: false
  presets: false
  showTokens: false
  
  sidePanel: true
  fileSearch: true
  bookmarks: true
  multiConvo: true
  fileCitations: true
  agents:
    use: true
  prompts:
    use: true
  marketplace:
    use: false
  mcpServers:
    use: false
  privacyPolicy:
    externalUrl: 'https://etrl.chat/privacy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://etrl.chat/terms'
    openNewTab: true
  helpAndFaqURL: ''

# ==============================================================================
# 2. ЭНДПОИНТЫ (Бэкенд)
# ==============================================================================
endpoints:
  custom:
    - name: 'litellm' # Единый OpenAI-compatible gateway для LibreChat
      apiKey: '${LITELLM_API_KEY}'
      baseURL: 'https://saas-litellm-gateway-production.up.railway.app'
      models:
        default:
          - 'etrl-ai'
          - 'my-model'
        fetch: false
      titleConvo: true
      titleModel: 'etrl-ai'
      modelDisplayLabel: 'ETRL AI'
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      supportsFiles: true
      fileTypes: ['image/*', 'application/pdf', 'text/*']

  agents:
    allowedProviders:
      - 'litellm'
    recursionLimit: 25
    maxRecursionLimit: 50
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - actions
      - context
      - tools
      - chain
      - ocr

# ==============================================================================
# 3. СПЕЦИФИКАЦИЯ МОДЕЛЕЙ (То, что видит юзер)
# ==============================================================================
modelSpecs:
  enforce: false
  prioritize: false
  list:
    - name: 'etrl-ai'
      label: 'ETRL AI'
      description: 'Единый агент ETRL для чата, файлов, поиска и инструментов'
      default: true # Делаем модель основной
      preset:
        endpoint: 'agents'
        agent_id: 'etrl-default-agent'
        model: 'etrl-ai'
      fileUpload: true
      visionCapable: true
      webSearch: true
      fileSearch: true
      executeCode: true
      mcpServers:
        - 'default'

# ==============================================================================
# 4. БИЛЛИНГ
# ==============================================================================
balance:
  enabled: true
  startBalance: 1500
  autoRefillEnabled: true
  refillIntervalValue: 1
  refillIntervalUnit: "days"
  refillAmount: 1000

# ==============================================================================
# 5. ОГРАНИЧЕНИЯ
# ==============================================================================
fileConfig:
  serverFileSizeLimit: 50
  avatarSizeLimit: 2
  endpoints:
    custom:
      fileLimit: 5
      fileSizeLimit: 10

rateLimits:
  messages:
    max: 100                # Максимальное количество сообщений
    windowInMinutes: 60     # Временное окно в минутах (1 час)
  
  # Дополнительные лимиты для безопасности
  fileUploads:
    ipMax: 20
    ipWindowInMinutes: 60
  conversationsImport:
    ipMax: 5
    ipWindowInMinutes: 60
