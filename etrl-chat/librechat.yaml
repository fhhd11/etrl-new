version: 1.3.4

cache: true
fileStrategy: "s3"

# ==============================================================================
# 1. ИНТЕРФЕЙС
# ==============================================================================
interface:
  appTitle: 'ETRL Chat'
  customWelcome: 'Добро пожаловать в ETRL Chat!'
  customCSS: true
  
  # ВКЛЮЧАЕМ НОВЫЕ ВОЗМОЖНОСТИ
  runCode: true          # Включает кнопку интерпретатора кода
  endpointsMenu: true    # <--- ВКЛЮЧЕНО! Это необходимо для отображения кнопки Агентов
  modelSelect: false
  parameters: false
  presets: true          # Включаем пресеты (полезно для сохранения системных промптов)
  showTokens: false
  
  sidePanel: true
  fileSearch: true
  bookmarks: true
  multiConvo: true
  fileCitations: true
  agents: true
  prompts:
    use: true
  marketplace:
    use: false          # Скрываем публичный маркетплейс (оставляем только приватный SaaS)
  mcpServers:
    use: true
    share: false
    create: true
  privacyPolicy:
    externalUrl: 'https://etrl.chat/privacy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://etrl.chat/terms'
    openNewTab: true
  helpAndFaqURL: ''

# ==============================================================================
# 2. ВЕБ-ПОИСК И ПАРСИНГ (Интеграция ваших Serper и Jina)
# ==============================================================================
webSearch:
  serperApiKey: '${SERPER_API_KEY}'
  jinaApiKey: '${JINA_API_KEY}'

# ==============================================================================
# 3. ЭНДПОИНТЫ И АГЕНТЫ (Бэкенд)
# ==============================================================================
endpoints:
  custom:
    - name: 'etrl' # Имя этого эндпоинта
      apiKey: '${ETRL_API_KEY}'
      baseURL: 'https://api.z.ai/api/coding/paas/v4'
      models:
        default: ['glm-4.7']
        fetch: false
      titleConvo: true
      titleModel: 'glm-4.7'
      modelDisplayLabel: 'ETRL AI'
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      supportsFiles: true
      fileTypes: ['image/*', 'application/pdf', 'text/*']

# ==============================================================================
# 4. СПЕЦИФИКАЦИЯ МОДЕЛЕЙ
# ==============================================================================
modelSpecs:
  list:
    - name: 'etrl-core' # <--- ИЗМЕНЕНО! Теперь в URL будет ?spec=etrl-core
      label: 'ETRL AI'
      description: 'Ваш персональный AI помощник с доступом в интернет и коду'
      default: true
      preset:
        endpoint: 'etrl'
        model: 'glm-4.7'
      fileUpload: true
      visionCapable: true

# ==============================================================================
# 5. ПАМЯТЬ (Долгосрочный контекст)
# ==============================================================================
memory:
  disabled: false
  validKeys:
    - "user_preferences"
    - "conversation_context"
    - "learned_facts"
  tokenLimit: 2000
  charLimit: 10000
  personalize: true
  messageWindowSize: 8
  agent:
    provider: "etrl"
    model: "glm-4.7"

# ==============================================================================
# 6. БИЛЛИНГ И ЛИМИТЫ
# ==============================================================================
balance:
  enabled: true
  startBalance: 1500
  autoRefillEnabled: true
  refillIntervalValue: 1
  refillIntervalUnit: "days"
  refillAmount: 1000

fileConfig:
  serverFileSizeLimit: 50
  avatarSizeLimit: 2
  endpoints:
    custom:
      fileLimit: 5
      fileSizeLimit: 10

rateLimits:
  messages:
    max: 100                # Максимальное количество сообщений
    windowInMinutes: 60     # Временное окно в минутах (1 час)
  
  # Дополнительные лимиты для безопасности
  fileUploads:
    ipMax: 20
    ipWindowInMinutes: 60
  conversationsImport:
    ipMax: 5
    ipWindowInMinutes: 60
